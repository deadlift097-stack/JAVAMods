name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create project files
        run: |
          mkdir -p scripts src/mod java/src/org/modhost examples/java config
          cat > CMakeLists.txt <<'SRCEOF'
          cmake_minimum_required(VERSION 3.22)

          project(mod_host LANGUAGES CXX)

          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          set(CMAKE_POSITION_INDEPENDENT_CODE ON)

          set(MOD_ID "mod_host" CACHE STRING "LeviLauncher mod package directory name")
          set(MOD_NAME "Mod Host" CACHE STRING "LeviLauncher mod display name")
          set(MOD_AUTHOR "you" CACHE STRING "LeviLauncher mod author")
          set(MOD_VERSION "0.1.0" CACHE STRING "LeviLauncher mod version")
          set(MOD_LIBRARY_NAME "mod_host" CACHE STRING "Native library name without lib prefix or .so suffix")
          set(MOD_MINECRAFT_VERSIONS "[\"1.26.62.1\", \"1.26.62\"]" CACHE STRING "Raw JSON array for manifest minecraft_versions")
          set(MOD_ICON "" CACHE STRING "Optional package-relative icon path, such as icon.png")

          include(FetchContent)

          FetchContent_Declare(
              preloader_android
              GIT_REPOSITORY https://github.com/LiteLDev/preloader-android.git
              GIT_TAG 0.2.2
              SOURCE_SUBDIR cmake/preloader-sdk
          )
          FetchContent_Declare(
              nlohmann_json
              GIT_REPOSITORY https://github.com/nlohmann/json.git
              GIT_TAG v3.11.3
          )
          FetchContent_Declare(
              boost_pfr
              GIT_REPOSITORY https://github.com/boostorg/pfr.git
              GIT_TAG boost-1.88.0
          )
          FetchContent_Declare(
              magic_enum
              GIT_REPOSITORY https://github.com/Neargye/magic_enum.git
              GIT_TAG v0.9.7
          )
          FetchContent_Declare(
              lua
              URL https://www.lua.org/ftp/lua-5.4.6.tar.gz
          )
          FetchContent_Declare(
              fmt
              GIT_REPOSITORY https://github.com/fmtlib/fmt.git
              GIT_TAG 11.2.0
          )
          set(FMT_DOC OFF CACHE BOOL "Disable fmt docs" FORCE)
          set(FMT_TEST OFF CACHE BOOL "Disable fmt tests" FORCE)
          set(FMT_INSTALL OFF CACHE BOOL "Disable fmt install rules" FORCE)
          FetchContent_MakeAvailable(preloader_android nlohmann_json boost_pfr magic_enum fmt lua)

          # The launcher's runtime reads an extra ModuleInfo member (onKeybind) that the
          # pinned SDK header does not have. Without this patch registerModule() reads
          # past the end of the struct and crashes the game.
          find_program(LEVI_PYTHON NAMES python3 python)
          if(NOT LEVI_PYTHON)
              message(FATAL_ERROR "python3 is required to patch the preloader SDK header")
          endif()
          execute_process(
              COMMAND "${LEVI_PYTHON}" "${CMAKE_CURRENT_SOURCE_DIR}/scripts/patch_sdk.py" "${preloader_android_SOURCE_DIR}"
              RESULT_VARIABLE LEVI_SDK_PATCH_RESULT
          )
          if(NOT LEVI_SDK_PATCH_RESULT EQUAL 0)
              message(FATAL_ERROR "Patching the preloader SDK header failed (see output above)")
          endif()

          FetchContent_GetProperties(preloader_android)
          set(LEVI_PRELOADER_INCLUDE_DIR "${preloader_android_SOURCE_DIR}/include")

          if(NOT ANDROID)
              set(LEVI_GENERATED_CONFIG_DIR "${CMAKE_CURRENT_BINARY_DIR}/generated-config")

              add_executable(levi_config_generator
                  src/config_generator.cpp
                  src/mod/Config.cpp
              )

              target_include_directories(levi_config_generator
                  PRIVATE
                      src
                      "${LEVI_PRELOADER_INCLUDE_DIR}"
              )

              target_compile_definitions(levi_config_generator PRIVATE PL_CONFIG_NO_RUNTIME)
              target_link_libraries(levi_config_generator PRIVATE
                  nlohmann_json::nlohmann_json
                  Boost::pfr
                  magic_enum::magic_enum
              )

              add_custom_target(levi_generate_config
                  COMMAND levi_config_generator "${LEVI_GENERATED_CONFIG_DIR}"
                  DEPENDS levi_config_generator
                  COMMENT "Generating config.json and config.schema.json"
                  VERBATIM
              )

              return()
          endif()

          if(NOT DEFINED LEVI_PACKAGE_CONFIG_DIR)
              set(LEVI_PACKAGE_CONFIG_DIR "${CMAKE_CURRENT_SOURCE_DIR}/config" CACHE PATH
                  "Directory containing config.json and config.schema.json to package")
          endif()

          get_filename_component(LEVI_PACKAGE_CONFIG_DIR "${LEVI_PACKAGE_CONFIG_DIR}" ABSOLUTE)
          set(LEVI_PACKAGE_CONFIG_JSON "${LEVI_PACKAGE_CONFIG_DIR}/config.json")
          set(LEVI_PACKAGE_CONFIG_SCHEMA "${LEVI_PACKAGE_CONFIG_DIR}/config.schema.json")

          if(NOT IS_DIRECTORY "${LEVI_PACKAGE_CONFIG_DIR}")
              message(FATAL_ERROR "LEVI_PACKAGE_CONFIG_DIR must be a directory: ${LEVI_PACKAGE_CONFIG_DIR}")
          endif()

          if(NOT EXISTS "${LEVI_PACKAGE_CONFIG_JSON}")
              message(FATAL_ERROR "LEVI_PACKAGE_CONFIG_DIR must contain config.json: ${LEVI_PACKAGE_CONFIG_JSON}")
          endif()

          if(NOT EXISTS "${LEVI_PACKAGE_CONFIG_SCHEMA}")
              message(FATAL_ERROR "LEVI_PACKAGE_CONFIG_DIR must contain config.schema.json: ${LEVI_PACKAGE_CONFIG_SCHEMA}")
          endif()

          if(NOT CMAKE_ANDROID_ARCH_ABI STREQUAL "arm64-v8a" AND
             NOT CMAKE_ANDROID_ARCH_ABI STREQUAL "armeabi-v7a")
              message(FATAL_ERROR "Unsupported Android ABI: ${CMAKE_ANDROID_ARCH_ABI}")
          endif()

          option(LEVI_LINK_PRELOADER
                 "Build and link the preloader target instead of leaving SDK symbols for runtime lookup"
                 ON)

          if(LEVI_LINK_PRELOADER AND NOT TARGET preloader)
              add_subdirectory("${preloader_android_SOURCE_DIR}" "${CMAKE_BINARY_DIR}/_preloader_android")
          endif()

          # Lua is compiled as C++ so that script errors unwind like C++ exceptions and
          # destructors in the host code run correctly.
          file(GLOB LUA_SOURCES CONFIGURE_DEPENDS "${lua_SOURCE_DIR}/src/*.c")
          list(FILTER LUA_SOURCES EXCLUDE REGEX "/(lua|luac)\\.c$")
          set_source_files_properties(${LUA_SOURCES} PROPERTIES LANGUAGE CXX)
          add_library(lua_core STATIC ${LUA_SOURCES})
          target_include_directories(lua_core PUBLIC "${lua_SOURCE_DIR}/src")
          set_target_properties(lua_core PROPERTIES
              CXX_STANDARD 17
              CXX_STANDARD_REQUIRED ON
              POSITION_INDEPENDENT_CODE ON
          )
          target_compile_options(lua_core PRIVATE -w)

          add_library(${MOD_LIBRARY_NAME} SHARED
              src/main.cpp
              src/mod/Config.cpp
              src/mod/JavaBridge.cpp
              src/mod/LuaHost.cpp
              src/mod/MyMod.cpp
          )

          set_target_properties(${MOD_LIBRARY_NAME} PROPERTIES
              OUTPUT_NAME "${MOD_LIBRARY_NAME}"
          )

          target_include_directories(${MOD_LIBRARY_NAME}
              PRIVATE
                  src
                  "${LEVI_PRELOADER_INCLUDE_DIR}"
          )

          target_compile_options(${MOD_LIBRARY_NAME}
              PRIVATE
                  $<$<COMPILE_LANG_AND_ID:CXX,Clang,GNU>:-fvisibility=hidden -fvisibility-inlines-hidden>
          )

          target_link_options(${MOD_LIBRARY_NAME}
              PRIVATE
                  "-Wl,-z,max-page-size=16384"
          )

          find_library(log-lib log REQUIRED)
          target_link_libraries(${MOD_LIBRARY_NAME} PRIVATE
              ${log-lib}
              ${CMAKE_DL_LIBS}
              lua_core
              nlohmann_json::nlohmann_json
              Boost::pfr
              magic_enum::magic_enum
              fmt::fmt
          )

          if(TARGET preloader)
              target_link_libraries(${MOD_LIBRARY_NAME} PRIVATE preloader)
          else()
              target_link_options(${MOD_LIBRARY_NAME} PRIVATE
                  "-Wl,--unresolved-symbols=ignore-all")
          endif()

          if(NOT CMAKE_STRIP)
              message(FATAL_ERROR "CMAKE_STRIP is required to strip the generated library.")
          endif()

          add_custom_command(TARGET ${MOD_LIBRARY_NAME} POST_BUILD
              COMMAND "${CMAKE_STRIP}" --strip-unneeded "$<TARGET_FILE:${MOD_LIBRARY_NAME}>"
              COMMENT "Stripping symbols from $<TARGET_FILE_NAME:${MOD_LIBRARY_NAME}>"
              VERBATIM
          )

          configure_file(
              "${CMAKE_CURRENT_SOURCE_DIR}/manifest.json.in"
              "${CMAKE_CURRENT_BINARY_DIR}/manifest.json"
              @ONLY
          )

          set(LEVI_PACKAGE_ROOT "${CMAKE_CURRENT_BINARY_DIR}/package")
          set(LEVI_PACKAGE_MOD_DIR "${LEVI_PACKAGE_ROOT}/${MOD_ID}")
          set(LEVI_PACKAGE_FILE "${CMAKE_CURRENT_BINARY_DIR}/${MOD_ID}-${MOD_VERSION}-${CMAKE_ANDROID_ARCH_ABI}.levipack")
          set(LEVI_PACKAGE_ICON_COMMAND)
          set(LEVI_PACKAGE_CONFIG_COMMAND
              COMMAND "${CMAKE_COMMAND}" -E copy_directory "${LEVI_PACKAGE_CONFIG_DIR}" "${LEVI_PACKAGE_MOD_DIR}/config")

          if(NOT MOD_ICON STREQUAL "")
              if(IS_ABSOLUTE "${MOD_ICON}")
                  message(FATAL_ERROR "MOD_ICON must be a package-relative path")
              endif()

              if(MOD_ICON MATCHES "(^|/)\\.\\.(/|$)")
                  message(FATAL_ERROR "MOD_ICON must not contain ..")
              endif()

              set(MOD_ICON_SOURCE "${CMAKE_CURRENT_SOURCE_DIR}/${MOD_ICON}")
              if(NOT EXISTS "${MOD_ICON_SOURCE}")
                  message(FATAL_ERROR "MOD_ICON does not exist: ${MOD_ICON_SOURCE}")
              endif()

              get_filename_component(MOD_ICON_DIR "${MOD_ICON}" DIRECTORY)
              if(NOT MOD_ICON_DIR STREQUAL "")
                  list(APPEND LEVI_PACKAGE_ICON_COMMAND
                      COMMAND "${CMAKE_COMMAND}" -E make_directory "${LEVI_PACKAGE_MOD_DIR}/${MOD_ICON_DIR}")
              endif()
              list(APPEND LEVI_PACKAGE_ICON_COMMAND
                  COMMAND "${CMAKE_COMMAND}" -E copy "${MOD_ICON_SOURCE}" "${LEVI_PACKAGE_MOD_DIR}/${MOD_ICON}")
          endif()

          add_custom_target(levi_package
              COMMAND "${CMAKE_COMMAND}" -E rm -rf "${LEVI_PACKAGE_ROOT}"
              COMMAND "${CMAKE_COMMAND}" -E make_directory "${LEVI_PACKAGE_MOD_DIR}"
              COMMAND "${CMAKE_COMMAND}" -E copy "$<TARGET_FILE:${MOD_LIBRARY_NAME}>" "${LEVI_PACKAGE_MOD_DIR}/lib${MOD_LIBRARY_NAME}.so"
              COMMAND "${CMAKE_COMMAND}" -E copy "${CMAKE_CURRENT_BINARY_DIR}/manifest.json" "${LEVI_PACKAGE_MOD_DIR}/manifest.json"
              ${LEVI_PACKAGE_ICON_COMMAND}
              ${LEVI_PACKAGE_CONFIG_COMMAND}
              COMMAND "${CMAKE_COMMAND}" -E chdir "${LEVI_PACKAGE_ROOT}" "${CMAKE_COMMAND}" -E tar "cf" "${LEVI_PACKAGE_FILE}" --format=zip "${MOD_ID}"
              WORKING_DIRECTORY "${CMAKE_CURRENT_BINARY_DIR}"
              DEPENDS ${MOD_LIBRARY_NAME}
              COMMENT "Packaging ${MOD_ID} for LeviLauncher"
              VERBATIM
          )
          SRCEOF
          cat > manifest.json.in <<'SRCEOF'
          {
            "type": "preload-native",
            "name": "@MOD_NAME@",
            "author": "@MOD_AUTHOR@",
            "version": "@MOD_VERSION@",
            "entry": "lib@MOD_LIBRARY_NAME@.so",
            "icon": "@MOD_ICON@",
            "minecraft_versions": @MOD_MINECRAFT_VERSIONS@
          }
          SRCEOF
          cat > scripts/package.ps1 <<'SRCEOF'
          param(
              [ValidateSet("arm64-v8a", "armeabi-v7a", "all")]
              [string]$Abi = "arm64-v8a",
              [string]$BuildRoot = "build",
              [string]$AndroidPlatform = "android-28",
              [string]$NdkHome = "",
              [string]$Generator = "Ninja"
          )

          $ErrorActionPreference = "Stop"

          $scriptDir = Split-Path -Parent $MyInvocation.MyCommand.Path
          $repoRoot = Resolve-Path (Join-Path $scriptDir "..")

          function Invoke-ConfigGeneration {
              $configBuildDir = Join-Path $repoRoot "$BuildRoot-config"

              & cmake -S $repoRoot -B $configBuildDir -G $Generator `
                  2>&1 |
                  ForEach-Object { Write-Host $_ }

              & cmake --build $configBuildDir --target levi_generate_config 2>&1 |
                  ForEach-Object { Write-Host $_ }

              return ((Resolve-Path (Join-Path $configBuildDir "generated-config")).Path -replace "\\", "/")
          }

          function Resolve-NdkHome {
              if (-not [string]::IsNullOrWhiteSpace($NdkHome) -and (Test-Path $NdkHome)) {
                  return (Resolve-Path $NdkHome).Path
              }

              if (-not [string]::IsNullOrWhiteSpace($env:ANDROID_HOME)) {
                  $preferredNdk = Join-Path $env:ANDROID_HOME "ndk/28.2.13676358"
                  if (Test-Path $preferredNdk) {
                      return (Resolve-Path $preferredNdk).Path
                  }

                  $ndkRoot = Join-Path $env:ANDROID_HOME "ndk"
                  if (Test-Path $ndkRoot) {
                      $candidate = Get-ChildItem -Path $ndkRoot -Directory |
                          Sort-Object Name -Descending |
                          Select-Object -First 1
                      if ($candidate) {
                          return $candidate.FullName
                      }
                  }
              }

              if (-not [string]::IsNullOrWhiteSpace($env:ANDROID_NDK_HOME) -and (Test-Path $env:ANDROID_NDK_HOME)) {
                  return (Resolve-Path $env:ANDROID_NDK_HOME).Path
              }

              throw "Android NDK not found. Set ANDROID_NDK_HOME or ANDROID_HOME."
          }

          function Invoke-ModBuild {
              param([string]$TargetAbi)

              $ndkHome = Resolve-NdkHome
              $toolchain = Join-Path $ndkHome "build/cmake/android.toolchain.cmake"
              $buildDir = Join-Path $repoRoot "$BuildRoot-$TargetAbi"
              $generatedConfigDir = Invoke-ConfigGeneration

              cmake -S $repoRoot -B $buildDir -G $Generator `
                  -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
                  -DANDROID_ABI="$TargetAbi" `
                  -DANDROID_PLATFORM="$AndroidPlatform" `
                  -DANDROID_STL="c++_shared" `
                  -DLEVI_PACKAGE_CONFIG_DIR="$generatedConfigDir"

              cmake --build $buildDir --target levi_package
          }

          if ($Abi -eq "all") {
              Invoke-ModBuild "arm64-v8a"
              Invoke-ModBuild "armeabi-v7a"
          } else {
              Invoke-ModBuild $Abi
          }
          SRCEOF
          cat > scripts/patch_sdk.py <<'SRCEOF'
          #!/usr/bin/env python3
          """Make the preloader SDK's ModuleInfo match the current LeviLauncher runtime.

          SDK 0.2.2 ends ModuleInfo after onConfigChanged. Newer launchers also read an
          onKeybind callback after it, which runs past the end of the old struct and
          crashes inside pl::modmenu::registerModule. This appends the missing member
          (empty = no callback) plus zeroed padding so extra trailing fields read as empty.
          """
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          headers = sorted(root.rglob("ModMenu.hpp"))
          if not headers:
              print(f"patch_sdk: ModMenu.hpp not found under {root}")
              sys.exit(1)

          path = headers[0]
          text = path.read_text(encoding="utf-8")

          if "onKeybind" in text:
              print(f"patch_sdk: {path} already has onKeybind, nothing to do")
              sys.exit(0)

          member = re.compile(
              r"(?:std::function<[^;{}]*?>|[\w:]+)\s+onConfigChanged\s*(?:\{\s*\}|=[^;]*)?;"
          )
          m = member.search(text)
          if not m:
              print(f"patch_sdk: could not find the onConfigChanged member in {path}")
              for i, line in enumerate(text.splitlines(), 1):
                  if "onConfigChanged" in line or "struct ModuleInfo" in line:
                      print(f"  line {i}: {line}")
              sys.exit(1)

          addition = (
              "\n    std::function<void()> onKeybind{};"
              "\n    unsigned char abiTailPadding_[128]{};"
          )
          text = text[: m.end()] + addition + text[m.end():]
          path.write_text(text, encoding="utf-8")
          print(f"patch_sdk: patched {path}")
          start = text.rfind("struct ModuleInfo", 0, m.end())
          print(text[start : m.end() + len(addition) + 20] if start != -1 else "(struct not located)")
          SRCEOF
          cat > src/config_generator.cpp <<'SRCEOF'
          #include "mod/Config.h"

          #include <filesystem>
          #include <fstream>
          #include <iostream>

          namespace {

          bool writeJson(const std::filesystem::path &path, const nlohmann::json &value) {
              std::error_code ec;
              std::filesystem::create_directories(path.parent_path(), ec);
              if (ec) {
                  std::cerr << "Failed to create " << path.parent_path() << ": " << ec.message() << '\n';
                  return false;
              }

              std::ofstream stream(path, std::ios::binary | std::ios::trunc);
              if (!stream) {
                  std::cerr << "Failed to open " << path << '\n';
                  return false;
              }

              stream << value.dump(2) << '\n';
              return stream.good();
          }

          } // namespace

          int main(int argc, char **argv) {
              if (argc != 2) {
                  std::cerr << "Usage: levi_config_generator <output-config-dir>\n";
                  return 2;
              }

              const std::filesystem::path outputDir = argv[1];
              if (!writeJson(outputDir / "config.json", luahost::makeDefaultConfigJson()))
                  return 1;
              if (!writeJson(outputDir / "config.schema.json", luahost::makeConfigSchemaJson()))
                  return 1;

              return 0;
          }
          SRCEOF
          cat > src/main.cpp <<'SRCEOF'
          #include "mod/MyMod.h"

          #include <pl/Mod.hpp>

          PL_REGISTER_MOD(luahost::LuaHostMod, luahost::LuaHostMod::instance());
          SRCEOF
          cat > src/mod/Config.h <<'SRCEOF'
          #pragma once

          #include <string>
          #include <string_view>

          #include <pl/Config.hpp>

          namespace luahost {

          struct ModConfig {
              int version = 1;
              bool enabled = true;
              // Register an in-game menu module for every Lua mod that calls menu.register.
              bool menuEnabled = true;
              // Load Java mods (.jar files with classes.dex) from the java_mods folder.
              bool javaMods = true;
              // Run on("tick") handlers about 20 times a second from a host thread.
              bool tickEvent = true;
              // Longest a single Lua call may run, in milliseconds.
              int maxScriptMs = 50;
              // Memory cap for each Lua mod, in megabytes.
              int maxMemoryMb = 32;
              // Install the attack hook so Lua mods get on("attack"). Off by default
              // because the hook target is not confirmed on every game build.
              bool attackEvent = false;
              // Optional override of the attack function offset (hex), e.g. "0x1009d290".
              std::string attackRva = "";
          };

          nlohmann::json makeDefaultConfigJson();
          nlohmann::json makeConfigSchemaJson();

          } // namespace luahost

          template <> struct pl::config::Schema<luahost::ModConfig> {
              static constexpr std::string_view title = "Mod Host Config";
              static constexpr std::string_view description = {};

              static constexpr FieldSchema field(std::string_view name) {
                  if (name == "version")
                      return {.title = "Version", .readOnly = true};
                  if (name == "enabled")
                      return {.title = "Enabled", .description = "Turns Mod Host on or off."};
                  if (name == "menuEnabled")
                      return {.title = "In-game menu", .description = "Show a menu module for Lua mods that define settings."};
                  if (name == "javaMods")
                      return {.title = "Java mods", .description = "Load Java mods from the java_mods folder."};
                  if (name == "tickEvent")
                      return {.title = "Tick event", .description = "Run on(\"tick\") handlers about 20 times a second."};
                  if (name == "maxScriptMs")
                      return {.title = "Script time limit (ms)", .description = "A Lua call running longer than this is stopped."};
                  if (name == "maxMemoryMb")
                      return {.title = "Memory limit per mod (MB)", .description = "A Lua mod using more memory than this is stopped."};
                  if (name == "attackEvent")
                      return {.title = "Attack event", .description = "Hook the game's attack function so Lua mods get on(\"attack\")."};
                  if (name == "attackRva")
                      return {.title = "Attack RVA", .description = "Optional hex offset of the attack function, e.g. 0x1009d290."};
                  return {};
              }
          };
          SRCEOF
          cat > src/mod/Config.cpp <<'SRCEOF'
          #include "mod/Config.h"

          namespace luahost {

          nlohmann::json makeDefaultConfigJson() { return pl::config::defaultJson(ModConfig{}); }

          nlohmann::json makeConfigSchemaJson() { return pl::config::schema(ModConfig{}); }

          } // namespace luahost
          SRCEOF
          cat > src/mod/JavaBridge.h <<'SRCEOF'
          #pragma once

          #include <atomic>
          #include <filesystem>
          #include <functional>
          #include <string>
          #include <string_view>
          #include <vector>

          #include <jni.h>

          #include "mod/Config.h"

          #include <pl/Mod.hpp>

          namespace luahost {

          // Connects the game process to the Java host (org.modhost.JavaHost) through JNI.
          class JavaBridge {
            public:
              // Creates the class loader that can see the bridge classes.
              using LoaderFactory = std::function<jobject(JNIEnv *)>;

              static JavaBridge &instance();

              // Returns false (after logging why) when Java support is not available.
              bool start(ll::mod::NativeMod &self, const ModConfig &config, const std::filesystem::path &modsDir,
                         const std::filesystem::path &dataDir, const std::filesystem::path &cacheDir,
                         const LoaderFactory &loaderFactory);
              void stop();
              [[nodiscard]] bool running() const { return mRunning.load(); }

              bool onKey(int keyCode, bool down, unsigned int unicodeChar);
              bool onTouch(int action, int pointerId, float x, float y);
              bool onMouse(int button, bool down);
              void onAttack();

              // Called by the launcher's menu for modules registered by Java mods.
              void handleToggle(std::string_view moduleId, bool enabled);
              void handleConfigChanged(std::string_view moduleId, std::string_view key, std::string_view value);

              // Called from the Java side through Native.
              bool registerMenuFromJava(const std::string &moduleId, const std::string &name, const std::string &description,
                                        bool enabled, const std::vector<std::string> &settings);
              void unregisterMenuFromJava(const std::string &moduleId);

              // Helper for the real game: builds an InMemoryDexClassLoader around embedded dex bytes.
              static jobject createInMemoryDexLoader(JNIEnv *env, const unsigned char *dex, size_t size);

            private:
              JavaBridge() = default;

              bool acquireVm();
              JNIEnv *env();
              bool checkException(JNIEnv *env, const char *where);
              jclass loadClass(JNIEnv *env, jobject loader, const char *dottedName);

              JavaVM *mVm = nullptr;
              ll::mod::NativeMod *mSelf = nullptr;
              std::atomic<bool> mRunning{false};
              jclass mHost = nullptr; // global refs
              jmethodID mOnKey = nullptr, mOnTouch = nullptr, mOnMouse = nullptr, mOnAttack = nullptr;
              jmethodID mOnToggle = nullptr, mOnConfig = nullptr, mStop = nullptr;
          };

          } // namespace luahost
          SRCEOF
          cat > src/mod/JavaBridge.cpp <<'SRCEOF'
          #include "mod/JavaBridge.h"

          #include <dlfcn.h>

          #include <string>
          #include <vector>

          #include <pl/ModMenu.hpp>

          #include "mod/LuaHost.h"

          namespace luahost {

          namespace {

          JavaVM *gCachedVm = nullptr;

          std::string toStd(JNIEnv *env, jstring s) {
              if (!s)
                  return {};
              const char *c = env->GetStringUTFChars(s, nullptr);
              if (!c)
                  return {};
              std::string out(c);
              env->ReleaseStringUTFChars(s, c);
              return out;
          }

          // ---- native methods bound to org.modhost.Native

          jboolean JNICALL nativeRegisterMenu(JNIEnv *env, jclass, jstring id, jstring name, jstring desc, jboolean enabled,
                                              jobjectArray settings) {
              std::vector<std::string> list;
              if (settings) {
                  const jsize n = env->GetArrayLength(settings);
                  for (jsize i = 0; i < n; ++i) {
                      jstring s = static_cast<jstring>(env->GetObjectArrayElement(settings, i));
                      list.push_back(toStd(env, s));
                      if (s)
                          env->DeleteLocalRef(s);
                  }
              }
              const bool ok = JavaBridge::instance().registerMenuFromJava(toStd(env, id), toStd(env, name), toStd(env, desc),
                                                                          enabled != JNI_FALSE, list);
              return ok ? JNI_TRUE : JNI_FALSE;
          }

          void JNICALL nativeUnregisterMenu(JNIEnv *env, jclass, jstring id) {
              JavaBridge::instance().unregisterMenuFromJava(toStd(env, id));
          }

          void JNICALL nativeLog(JNIEnv *env, jclass, jstring level, jstring mod, jstring message) {
              const std::string lv = toStd(env, level);
              LuaHost::instance().log(lv.c_str(), toStd(env, mod), toStd(env, message));
          }

          // ---- menu callbacks for Java-registered modules

          void javaToggleThunk(std::string_view moduleId, bool enabled) {
              JavaBridge::instance().handleToggle(moduleId, enabled);
          }

          void javaConfigThunk(std::string_view moduleId, std::string_view key, std::string_view value) {
              JavaBridge::instance().handleConfigChanged(moduleId, key, value);
          }

          // Attach the change callback only if this SDK's builder accepts one with this shape.
          template <class B> bool attachConfigCallback(B &builder) {
              if constexpr (requires { builder.onConfigChanged(&javaConfigThunk); }) {
                  builder.onConfigChanged(&javaConfigThunk);
                  return true;
              } else {
                  return false;
              }
          }

          struct MenuEntry {
              std::string key, label, type, value, min, max;
          };

          std::vector<std::string> splitUnit(const std::string &s) {
              std::vector<std::string> parts;
              std::string cur;
              for (char c : s) {
                  if (c == '\x1f') {
                      parts.push_back(cur);
                      cur.clear();
                  } else {
                      cur += c;
                  }
              }
              parts.push_back(cur);
              return parts;
          }

          } // namespace

          extern "C" JNIEXPORT jint JNICALL JNI_OnLoad(JavaVM *vm, void *) {
              gCachedVm = vm;
              return JNI_VERSION_1_6;
          }

          JavaBridge &JavaBridge::instance() {
              static JavaBridge *bridge = new JavaBridge(); // intentionally never destroyed
              return *bridge;
          }

          bool JavaBridge::acquireVm() {
              if (mVm)
                  return true;
              if (gCachedVm) {
                  mVm = gCachedVm;
                  return true;
              }
              using GetVmsFn = jint (*)(JavaVM **, jsize, jsize *);
              auto fn = reinterpret_cast<GetVmsFn>(dlsym(RTLD_DEFAULT, "JNI_GetCreatedJavaVMs"));
              if (!fn)
                  return false;
              JavaVM *vm = nullptr;
              jsize count = 0;
              if (fn(&vm, 1, &count) != JNI_OK || count < 1 || !vm)
                  return false;
              mVm = vm;
              return true;
          }

          JNIEnv *JavaBridge::env() {
              if (!mVm)
                  return nullptr;
              JNIEnv *e = nullptr;
              const jint r = mVm->GetEnv(reinterpret_cast<void **>(&e), JNI_VERSION_1_6);
              if (r == JNI_OK)
                  return e;
              if (r == JNI_EDETACHED) {
          #ifdef __ANDROID__
                  if (mVm->AttachCurrentThread(&e, nullptr) == JNI_OK)
                      return e;
          #else
                  if (mVm->AttachCurrentThread(reinterpret_cast<void **>(&e), nullptr) == JNI_OK)
                      return e;
          #endif
              }
              return nullptr;
          }

          bool JavaBridge::checkException(JNIEnv *e, const char *where) {
              if (!e->ExceptionCheck())
                  return false;
              jthrowable t = e->ExceptionOccurred();
              e->ExceptionClear();
              std::string text = "(unknown Java exception)";
              if (t) {
                  jclass thr = e->FindClass("java/lang/Throwable");
                  if (thr) {
                      jmethodID toString = e->GetMethodID(thr, "toString", "()Ljava/lang/String;");
                      if (toString) {
                          jstring js = static_cast<jstring>(e->CallObjectMethod(t, toString));
                          if (!e->ExceptionCheck()) {
                              text = toStd(e, js);
                              if (js)
                                  e->DeleteLocalRef(js);
                          } else {
                              e->ExceptionClear();
                          }
                      }
                      e->DeleteLocalRef(thr);
                  }
                  e->DeleteLocalRef(t);
              }
              LuaHost::instance().log("ERROR", "java", std::string(where) + ": " + text);
              return true;
          }

          jclass JavaBridge::loadClass(JNIEnv *e, jobject loader, const char *dottedName) {
              jclass clClass = e->FindClass("java/lang/ClassLoader");
              if (!clClass) {
                  checkException(e, "ClassLoader lookup");
                  return nullptr;
              }
              jmethodID load = e->GetMethodID(clClass, "loadClass", "(Ljava/lang/String;)Ljava/lang/Class;");
              jstring name = e->NewStringUTF(dottedName);
              jobject cls = load ? e->CallObjectMethod(loader, load, name) : nullptr;
              e->DeleteLocalRef(name);
              e->DeleteLocalRef(clClass);
              if (checkException(e, dottedName))
                  return nullptr;
              return static_cast<jclass>(cls);
          }

          jobject JavaBridge::createInMemoryDexLoader(JNIEnv *e, const unsigned char *dex, size_t size) {
              if (!dex || size == 0)
                  return nullptr;
              jclass clClass = e->FindClass("java/lang/ClassLoader");
              jmethodID getSystem = clClass ? e->GetStaticMethodID(clClass, "getSystemClassLoader", "()Ljava/lang/ClassLoader;")
                                            : nullptr;
              jobject parent = getSystem ? e->CallStaticObjectMethod(clClass, getSystem) : nullptr;
              jobject buffer = e->NewDirectByteBuffer(const_cast<unsigned char *>(dex), static_cast<jlong>(size));
              jclass loaderClass = e->FindClass("dalvik/system/InMemoryDexClassLoader");
              jobject loader = nullptr;
              if (loaderClass && buffer) {
                  jmethodID ctor = e->GetMethodID(loaderClass, "<init>", "(Ljava/nio/ByteBuffer;Ljava/lang/ClassLoader;)V");
                  if (ctor)
                      loader = e->NewObject(loaderClass, ctor, buffer, parent);
              }
              if (e->ExceptionCheck())
                  e->ExceptionClear();
              if (loaderClass)
                  e->DeleteLocalRef(loaderClass);
              if (buffer)
                  e->DeleteLocalRef(buffer);
              if (parent)
                  e->DeleteLocalRef(parent);
              if (clClass)
                  e->DeleteLocalRef(clClass);
              return loader;
          }

          bool JavaBridge::start(ll::mod::NativeMod &self, const ModConfig &config, const std::filesystem::path &modsDir,
                                 const std::filesystem::path &dataDir, const std::filesystem::path &cacheDir,
                                 const LoaderFactory &loaderFactory) {
              LuaHost &host = LuaHost::instance();
              if (mRunning.load())
                  return true;
              mSelf = &self;
              if (!acquireVm()) {
                  host.log("WARN", "java", "Java mods unavailable: could not find the Java VM");
                  return false;
              }
              JNIEnv *e = env();
              if (!e) {
                  host.log("WARN", "java", "Java mods unavailable: could not attach to the Java VM");
                  return false;
              }
              jobject loader = loaderFactory ? loaderFactory(e) : nullptr;
              if (checkException(e, "creating the class loader") || !loader) {
                  host.log("ERROR", "java", "Java mods unavailable: could not create the class loader (needs Android 8+ and the bridge dex)");
                  return false;
              }
              jclass hostLocal = loadClass(e, loader, "org.modhost.JavaHost");
              jclass nativeCls = loadClass(e, loader, "org.modhost.Native");
              if (!hostLocal || !nativeCls) {
                  host.log("ERROR", "java", "Java mods unavailable: bridge classes not found");
                  return false;
              }

              JNINativeMethod methods[3];
              methods[0] = {const_cast<char *>("registerMenu0"),
                            const_cast<char *>("(Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;Z[Ljava/lang/String;)Z"),
                            reinterpret_cast<void *>(&nativeRegisterMenu)};
              methods[1] = {const_cast<char *>("unregisterMenu0"), const_cast<char *>("(Ljava/lang/String;)V"),
                            reinterpret_cast<void *>(&nativeUnregisterMenu)};
              methods[2] = {const_cast<char *>("log0"),
                            const_cast<char *>("(Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;)V"),
                            reinterpret_cast<void *>(&nativeLog)};
              if (e->RegisterNatives(nativeCls, methods, 3) != JNI_OK || checkException(e, "RegisterNatives")) {
                  host.log("ERROR", "java", "Java mods unavailable: could not bind native methods");
                  return false;
              }

              mHost = static_cast<jclass>(e->NewGlobalRef(hostLocal));
              mOnKey = e->GetStaticMethodID(mHost, "onKey", "(IZI)Z");
              mOnTouch = e->GetStaticMethodID(mHost, "onTouch", "(IIFF)Z");
              mOnMouse = e->GetStaticMethodID(mHost, "onMouse", "(IZ)Z");
              mOnAttack = e->GetStaticMethodID(mHost, "onAttack", "()V");
              mOnToggle = e->GetStaticMethodID(mHost, "onToggle", "(Ljava/lang/String;Z)V");
              mOnConfig = e->GetStaticMethodID(mHost, "onConfigChanged",
                                               "(Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;)V");
              mStop = e->GetStaticMethodID(mHost, "stop", "()V");
              jmethodID setApi = e->GetStaticMethodID(mHost, "setNativeApi", "(Lorg/modhost/NativeApi;)V");
              jmethodID startId = e->GetStaticMethodID(mHost, "start",
                                                       "(Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;Z)V");
              jmethodID nativeCtor = e->GetMethodID(nativeCls, "<init>", "()V");
              if (checkException(e, "looking up Java methods") || !mOnKey || !mOnTouch || !mOnMouse || !mOnAttack ||
                  !mOnToggle || !mOnConfig || !mStop || !setApi || !startId || !nativeCtor) {
                  host.log("ERROR", "java", "Java mods unavailable: bridge classes do not match this build");
                  e->DeleteGlobalRef(mHost);
                  mHost = nullptr;
                  return false;
              }

              jobject nativeObj = e->NewObject(nativeCls, nativeCtor);
              e->CallStaticVoidMethod(mHost, setApi, nativeObj);
              e->DeleteLocalRef(nativeObj);

              jstring jMods = e->NewStringUTF(modsDir.string().c_str());
              jstring jData = e->NewStringUTF(dataDir.string().c_str());
              jstring jCache = e->NewStringUTF(cacheDir.string().c_str());
              e->CallStaticVoidMethod(mHost, startId, jMods, jData, jCache, config.tickEvent ? JNI_TRUE : JNI_FALSE);
              e->DeleteLocalRef(jMods);
              e->DeleteLocalRef(jData);
              e->DeleteLocalRef(jCache);
              e->DeleteLocalRef(hostLocal);
              e->DeleteLocalRef(nativeCls);
              e->DeleteLocalRef(loader);
              if (checkException(e, "starting the Java host")) {
                  mRunning = true; // let stop() clean up whatever did load
                  stop();
                  return false;
              }
              mRunning = true;
              host.log("INFO", "java", "Java host running");
              return true;
          }

          void JavaBridge::stop() {
              if (!mRunning.exchange(false))
                  return;
              JNIEnv *e = env();
              if (e && mHost && mStop) {
                  e->CallStaticVoidMethod(mHost, mStop);
                  checkException(e, "stopping the Java host");
                  e->DeleteGlobalRef(mHost);
              }
              mHost = nullptr;
          }

          bool JavaBridge::onKey(int keyCode, bool down, unsigned int unicodeChar) {
              if (!mRunning.load())
                  return false;
              JNIEnv *e = env();
              if (!e)
                  return false;
              const jboolean r = e->CallStaticBooleanMethod(mHost, mOnKey, static_cast<jint>(keyCode),
                                                            down ? JNI_TRUE : JNI_FALSE, static_cast<jint>(unicodeChar));
              if (checkException(e, "key event"))
                  return false;
              return r != JNI_FALSE;
          }

          bool JavaBridge::onTouch(int action, int pointerId, float x, float y) {
              if (!mRunning.load())
                  return false;
              JNIEnv *e = env();
              if (!e)
                  return false;
              const jboolean r = e->CallStaticBooleanMethod(mHost, mOnTouch, static_cast<jint>(action),
                                                            static_cast<jint>(pointerId), static_cast<jdouble>(x),
                                                            static_cast<jdouble>(y));
              if (checkException(e, "touch event"))
                  return false;
              return r != JNI_FALSE;
          }

          bool JavaBridge::onMouse(int button, bool down) {
              if (!mRunning.load())
                  return false;
              JNIEnv *e = env();
              if (!e)
                  return false;
              const jboolean r =
                  e->CallStaticBooleanMethod(mHost, mOnMouse, static_cast<jint>(button), down ? JNI_TRUE : JNI_FALSE);
              if (checkException(e, "mouse event"))
                  return false;
              return r != JNI_FALSE;
          }

          void JavaBridge::onAttack() {
              if (!mRunning.load())
                  return;
              JNIEnv *e = env();
              if (!e)
                  return;
              e->CallStaticVoidMethod(mHost, mOnAttack);
              checkException(e, "attack event");
          }

          void JavaBridge::handleToggle(std::string_view moduleId, bool enabled) {
              JNIEnv *e = env();
              if (!e || !mHost)
                  return;
              jstring id = e->NewStringUTF(std::string(moduleId).c_str());
              e->CallStaticVoidMethod(mHost, mOnToggle, id, enabled ? JNI_TRUE : JNI_FALSE);
              e->DeleteLocalRef(id);
              checkException(e, "menu toggle");
          }

          void JavaBridge::handleConfigChanged(std::string_view moduleId, std::string_view key, std::string_view value) {
              JNIEnv *e = env();
              if (!e || !mHost)
                  return;
              jstring id = e->NewStringUTF(std::string(moduleId).c_str());
              jstring k = e->NewStringUTF(std::string(key).c_str());
              jstring v = e->NewStringUTF(std::string(value).c_str());
              e->CallStaticVoidMethod(mHost, mOnConfig, id, k, v);
              e->DeleteLocalRef(id);
              e->DeleteLocalRef(k);
              e->DeleteLocalRef(v);
              checkException(e, "menu change");
          }

          bool JavaBridge::registerMenuFromJava(const std::string &moduleId, const std::string &name,
                                                const std::string &description, bool enabled,
                                                const std::vector<std::string> &settings) {
              LuaHost &host = LuaHost::instance();
              if (!mSelf)
                  return false;
              if (host.guardTripped("java_menu.pending")) {
                  host.log("WARN", "java", "The menu crashed the game last time; skipping it. Delete java_menu.pending in the mod's data folder to retry.");
                  return false;
              }
              host.guardSet("java_menu.pending");

              std::vector<MenuEntry> entries;
              for (const std::string &line : settings) {
                  const std::vector<std::string> p = splitUnit(line);
                  if (p.size() < 6)
                      continue;
                  entries.push_back({p[0], p[1], p[2], p[3], p[4], p[5]});
              }

              pl::modmenu::ModuleBuilder builder(moduleId.c_str(), name.c_str());
              builder.modId(mSelf->getId());
              builder.description(description.c_str());
              builder.defaultEnabled(enabled);
              builder.onToggle(&javaToggleThunk);
              for (const MenuEntry &s : entries) {
                  if (s.type == "toggle") {
                      builder.config(s.key.c_str(), s.label.c_str(), pl::modmenu::ConfigType::Toggle, s.value.c_str());
                  } else {
                      builder.config(s.key.c_str(), s.label.c_str(),
                                     s.type == "slider" ? pl::modmenu::ConfigType::SliderInt
                                                        : pl::modmenu::ConfigType::SliderFloat,
                                     s.value.c_str(), s.min.c_str(), s.max.c_str());
                  }
              }
              if (!attachConfigCallback(builder))
                  host.log("WARN", "java", "this SDK has no menu change callback; menu edits will not reach Java mods");
              const bool ok = builder.registerModule();
              host.guardClear("java_menu.pending");
              return ok;
          }

          void JavaBridge::unregisterMenuFromJava(const std::string &moduleId) {
              pl::modmenu::unregisterModule(moduleId.c_str());
          }

