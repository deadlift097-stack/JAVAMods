              @Override
              public void onLoad(ModContext ctx) {
                  ctx.registerMenu(new Menu("Hello Java")
                          .description("Example Java mod: logs key presses and greets you.")
                          .toggle("logKeys", "Log key presses", false)
                          .slider("greetDelay", "Greeting delay (s)", 3, 1, 30));

                  ctx.after(ctx.settings().getInt("greetDelay") * 1000L,
                          () -> ctx.log("Hello from Java! This is " + ctx.name()));

                  ctx.onKey((code, down, unicodeChar) -> {
                      if (down && ctx.settings().getBoolean("logKeys")) {
                          ctx.log("key " + code);
                      }
                      return false; // do not consume the key
                  });

                  ctx.onAttack(timeMs -> {
                      hits++;
                      ctx.storage().putLong("hits", hits);
                  });
              }
          }
          SRCEOF
          cat > examples/java/modhost-mod.properties <<'SRCEOF'
          main=example.hello.HelloJavaMod
          id=hello_java
          name=Hello Java
          version=1.0
          author=you
          description=Example Java mod
          api=1
          SRCEOF

      - name: Install NDK and Ninja
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-28" "ndk;28.2.13676358"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build Java bridge
        run: |
          set -e
          PLATFORM_JAR="$ANDROID_HOME/platforms/android-28/android.jar"
          D8="$(ls -d $ANDROID_HOME/build-tools/*/d8 | sort -V | tail -1)"
          mkdir -p build-java/classes build-java/dex build-java/hello/classes build-java/hello/dex
          javac --release 8 -Xlint:-options -d build-java/classes $(find java/src -name '*.java')
          "$D8" --release --min-api 26 --lib "$PLATFORM_JAR" --output build-java/dex $(find build-java/classes -name '*.class')
          python3 - <<'PYEOF'
          data = open('build-java/dex/classes.dex', 'rb').read()
          with open('src/mod/BridgeDex.inc', 'w') as f:
              f.write('// Generated from the compiled Java bridge.\nstatic const unsigned char kBridgeDex[] = {\n')
              for i in range(0, len(data), 16):
                  f.write(','.join(str(b) for b in data[i:i + 16]) + ',\n')
              f.write('0};\nstatic const unsigned int kBridgeDexSize = %d;\n' % len(data))
          PYEOF
          jar --create --file build-java/modhost-api.jar -C build-java/classes .
          javac --release 8 -Xlint:-options -cp build-java/classes -d build-java/hello/classes examples/java/HelloJavaMod.java
          "$D8" --release --min-api 26 --lib "$PLATFORM_JAR" --classpath build-java/classes --output build-java/hello/dex $(find build-java/hello/classes -name '*.class')
          cp examples/java/modhost-mod.properties build-java/hello/dex/
          (cd build-java/hello/dex && jar --create --file ../../hello-java-mod.jar classes.dex modhost-mod.properties)

      - name: Build packages
        shell: pwsh
        run: ./scripts/package.ps1 -Abi arm64-v8a

      - name: Upload Mod Host
        uses: actions/upload-artifact@v4
        with:
          name: mod-host
          path: build-*/*.levipack

      - name: Upload Java API jar
        uses: actions/upload-artifact@v4
        with:
          name: modhost-api
          path: build-java/modhost-api.jar

      - name: Upload Hello Java mod
        uses: actions/upload-artifact@v4
        with:
          name: hello-java-mod
          path: build-java/hello-java-mod.jar
